<svg xmlns="http://www.w3.org/2000/svg" width="840" height="528" viewBox="0 0 840 528" role="img" aria-label="The homelab k3s cluster: 31 Helm releases by namespace. One question passes through caddy, oauth2-proxy, homelab-ui, agent-runtime, agent-toolbox, postgres-mcp, llama-swap, then its trace lands in Tempo.">
  <style>
    .hop { animation: hop 5.7s linear infinite backwards; }
    .tel { animation: tel 5.7s linear infinite backwards; }
