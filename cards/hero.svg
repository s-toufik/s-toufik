<svg xmlns="http://www.w3.org/2000/svg" width="840" height="712" viewBox="0 0 840 712" role="img" aria-label="Terminal: Toufik Saouchi · software engineer. I build AI agents and the single-server platform they run on. About me I build software the way I&#x27;d like to maintain it: clear layers, small swappable parts, and tests that guard the architecture. AI agents: planning, tool use over MCP, self-review, explicit routing Observability: metrics, logs and traces, end to end A homelab that grows into a real platform: k3s, local LLMs, data Hexagonal architecture · typed Python · tested boundaries Project status: agent-runtime, agent-toolbox, homelab-ui, homelab-infra, nexus, kube-charts, pycraftcore, archetype, pricelab-core, pricelab-retriever, pricelabcpp-core, pricelabr-core, blender, Orion">
