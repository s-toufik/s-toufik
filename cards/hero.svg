  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="24" y="68" class="typed" style="animation-delay:0.10s"><tspan fill="#60a5fa">toufik@homelab</tspan><tspan fill="#5b6779">:~$ </tspan><tspan fill="#e6edf3">whoami</tspan></text><text x="24" y="90" class="typed" style="animation-delay:0.40s"><tspan fill="#e6edf3">Toufik Saouchi · software engineer</tspan></text><text x="24" y="110" class="typed" style="animation-delay:0.50s"><tspan fill="#8b98ab">I build AI agents and the single-server platform they run on.</tspan></text><text x="24" y="142" class="typed" style="animation-delay:0.90s"><tspan fill="#60a5fa">toufik@homelab</tspan><tspan fill="#5b6779">:~$ </tspan><tspan fill="#e6edf3">cat about.md</tspan></text><text x="24" y="164" class="typed" style="animation-delay:1.20s"><tspan fill="#38bdf8" font-weight="600"># About me</tspan></text><text x="24" y="184" class="typed" style="animation-delay:1.28s"><tspan fill="#8b98ab">I build software the way I&#x27;d like to maintain it: clear layers, small</tspan></text><text x="24" y="204" class="typed" style="animation-delay:1.36s"><tspan fill="#8b98ab">swappable parts, and tests that guard the architecture.</tspan></text><text x="24" y="224" class="typed" style="animation-delay:1.44s"></text><text x="24" y="234" class="typed" style="animation-delay:1.52s"><tspan fill="#60a5fa">  ▸ </tspan><tspan fill="#e6edf3">AI agents: planning, tool use over MCP, self-review, explicit routing</tspan></text><text x="24" y="254" class="typed" style="animation-delay:1.60s"><tspan fill="#60a5fa">  ▸ </tspan><tspan fill="#e6edf3">Observability: metrics, logs and traces, end to end</tspan></text><text x="24" y="274" class="typed" style="animation-delay:1.68s"><tspan fill="#60a5fa">  ▸ </tspan><tspan fill="#e6edf3">A homelab that grows into a real platform: k3s, local LLMs, data</tspan></text><text x="24" y="294" class="typed" style="animation-delay:1.76s"><tspan fill="#60a5fa">  ▸ </tspan><tspan fill="#e6edf3">Hexagonal architecture · typed Python · tested boundaries</tspan></text><