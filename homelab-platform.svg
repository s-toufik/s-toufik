<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-label="Homelab platform: homelab-ui on top of homelab-infra, which runs the applications and the platform stacks with Docker Compose, released through PyPI and Docker Hub">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <linearGradient id="ui" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #e6edf3; }
      .sub { font-size: 12.5px; fill: #8b949e; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #8b949e; }
      .tile-title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
      .tile-text { font-size: 11.5px; fill: #9ca3af; }
      .next { font-size: 13px; font-weight: 600; fill: #6b7280; }
      .tag { font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="609" rx="18" fill="#0d1117" stroke="#30363d"/>

  <rect x="250" y="28" width="460" height="92" rx="14" fill="url(#ui)"/>
  <text x="480" y="62" text-anchor="middle" class="title" fill="#ffffff">homelab-ui</text>
  <text x="480" y="85" text-anchor="middle" font-size="13" fill="#dbeafe">control · presentation · health checks</text>
  <text x="480" y="105" text-anchor="middle" font-size="12" fill="#bfdbfe">a page per application · status of every stack</text>

  <line x1="480" y1="120" x2="480" y2="150" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="36" y="154" width="888" height="334" rx="16" fill="#0b1220" stroke="#1e3a5f"/>
  <text x="62" y="186" class="title">homelab-infra</text>
  <text x="190" y="186" class="sub">one server · every stack deployed with Docker Compose</text>

  <text x="62" y="222" class="label">APPLICATIONS</text>
  <rect x="62" y="234" width="250" height="72" rx="12" fill="#13213d" stroke="#3b82f6"/>
  <text x="84" y="264" class="tile-title">AI agent</text>
  <text x="84" y="286" class="tile-text">plans, uses tools, checks its answers</text>
  <rect x="246" y="250" width="50" height="20" rx="10" fill="#14532d"/>
  <text x="271" y="264" text-anchor="middle" class="tag" fill="#4ade80">live</text>

  <rect x="328" y="234" width="250" height="72" rx="12" fill="#1c1533" stroke="#8b5cf6"/>
  <text x="350" y="264" class="tile-title">pricelab</text>
  <text x="350" y="286" class="tile-text">pricing applications</text>
  <rect x="488" y="250" width="74" height="20" rx="10" fill="#2e1065"/>
  <text x="525" y="264" text-anchor="middle" class="tag" fill="#c4b5fd">coming</text>

  <rect x="594" y="234" width="304" height="72" rx="12" fill="none" stroke="#374151" stroke-dasharray="6 5"/>
  <text x="746" y="266" text-anchor="middle" class="next">+ next applications</text>
  <text x="746" y="287" text-anchor="middle" class="tile-text">each one gets its page in homelab-ui</text>

  <text x="62" y="338" class="label">PLATFORM STACKS</text>
  <rect x="62" y="350" width="158" height="112" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="378" class="tile-title">AI models</text>
  <text x="80" y="401" class="tile-text">llama.cpp</text>
  <text x="80" y="419" class="tile-text">llama-swap</text>
  <text x="80" y="437" class="tile-text">OpenAI-compatible API</text>

  <rect x="232" y="350" width="158" height="112" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="250" y="378" class="tile-title">Observability</text>
  <text x="250" y="401" class="tile-text">OpenTelemetry</text>
  <text x="250" y="419" class="tile-text">Prometheus · Loki</text>
  <text x="250" y="437" class="tile-text">Tempo · Grafana</text>

  <rect x="402" y="350" width="158" height="112" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="420" y="378" class="tile-title">Data &amp; streaming</text>
  <text x="420" y="401" class="tile-text">PostgreSQL</text>
  <text x="420" y="419" class="tile-text">MongoDB</text>
  <text x="420" y="437" class="tile-text">Kafka</text>

  <rect x="572" y="350" width="158" height="112" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="590" y="378" class="tile-title">Access</text>
  <text x="590" y="401" class="tile-text">Tailscale</text>
  <text x="590" y="419" class="tile-text">private network only</text>

  <rect x="742" y="350" width="156" height="112" rx="12" fill="none" stroke="#374151" stroke-dasharray="6 5"/>
  <text x="820" y="402" text-anchor="middle" class="next">+ next stacks</text>
  <text x="820" y="423" text-anchor="middle" class="tile-text">one folder, one include</text>

  <text x="36" y="526" class="label">RELEASE</text>
  <rect x="120" y="506" width="170" height="74" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="205" y="538" text-anchor="middle" class="tile-title">Git repositories</text>
  <text x="205" y="559" text-anchor="middle" class="tile-text">source code</text>

  <line x1="290" y1="543" x2="336" y2="526" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="290" y1="543" x2="336" y2="563" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="340" y="500" width="230" height="40" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="358" y="525" class="tile-title" font-size="13">PyPI</text>
  <text x="400" y="525" class="tile-text">shared libraries</text>
  <rect x="340" y="546" width="230" height="40" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="358" y="571" class="tile-title" font-size="13">Docker Hub</text>
  <text x="446" y="571" class="tile-text">application images</text>

  <line x1="570" y1="543" x2="616" y2="543" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="620" y="506" width="278" height="74" rx="12" fill="#13213d" stroke="#3b82f6"/>
  <text x="759" y="538" text-anchor="middle" class="tile-title">docker compose pull · up</text>
  <text x="759" y="559" text-anchor="middle" class="tile-text">on homelab-infra</text>
</svg>
