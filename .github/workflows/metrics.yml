name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Achievements
        run: python3 .github/scripts/achievements.py "${{ github.repository_owner }}" metrics.achievements.svg
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}

      - name: Commit achievements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.achievements.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update metrics.achievements.svg [skip ci]"
          git pull --rebase
          git push

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          config_timezone: Europe/Paris
          plugin_calendar: yes
          plugin_calendar_limit: 1
