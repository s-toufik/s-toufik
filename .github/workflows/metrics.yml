name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/**"
      - ".github/profile.json"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hero, cluster map, achievements, languages, streak, and the trace of this run.
      # Featured projects and the cluster settings live in .github/profile.json.
      - name: Render the profile
        run: python3 .github/scripts/render.py "${{ github.repository_owner }}" .github/profile.json cards

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update profile cards [skip ci]"
          git pull --rebase
          git push
