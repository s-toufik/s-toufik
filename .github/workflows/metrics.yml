name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

env:
  # Repositories shown as cards under "Featured projects" in the README.
  FEATURED: >-
    agent-runtime agent-toolbox homelab-ui homelab-infra
    kube-charts pycraftcore archetype web_framework_benchmark

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Achievements
        run: python3 .github/scripts/achievements.py "${{ github.repository_owner }}" metrics.achievements.svg

      - name: Project, language and streak cards
        run: python3 .github/scripts/cards.py "${{ github.repository_owner }}" cards $FEATURED

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.achievements.svg cards
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update profile cards [skip ci]"
          git pull --rebase
          git push
